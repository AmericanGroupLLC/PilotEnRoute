# CI for PilotEnRoute: analyze, host tests, and the app built, launched and
# driven on an iOS simulator and an Android emulator. Every job runs
# tools/verify.sh, the same script used on the AGL Mac, so CI and a local run
# check the same things and print the same short summary (Actions → run →
# Summary; or `tools/ci_status.sh` for the result in a few lines).
#
# Why this runs here again (office decision 2026-10-17, decision-log.md):
# CI was moved to agl-manifest to avoid paying for 37 repos' minutes, macOS
# at 10x. This repository is public, and GitHub does not bill Actions minutes
# on standard runners for public repositories, so a per-push check costs
# nothing here.
#
# Delivery is NOT here. TestFlight / Play uploads stay in agl-manifest
# (ship.yml), behind the pre-delivery gate and the 2026-10-15 submission
# hold. Nothing in this file uploads a build or touches a store.
#
# Needs one secret: AGL_PACKAGES_TOKEN (read access to the private
# AmericanGroupLLC-Backend repo, where agl_i18n / agl_observability / agl_ads
# live). Without it every job stops at its first step with an error saying so.

name: CI

on:
  push:
    branches: [master]
    paths-ignore: ['fastlane/**', 'store_screenshots/**', '**/*.md']
  pull_request:
    paths-ignore: ['fastlane/**', 'store_screenshots/**', '**/*.md']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.2'

jobs:
  test:
    name: Analyze and host tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Authenticate pub for the private shared packages
        env:
          TOKEN: ${{ secrets.AGL_PACKAGES_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::AGL_PACKAGES_TOKEN is not set. Add it (read access to AmericanGroupLLC-Backend) as a repository or organization secret."
            exit 1
          fi
          git config --global url."https://x-access-token:$TOKEN@github.com/".insteadOf "https://github.com/"
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: tools/verify.sh quick
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-${{ github.job }}
          path: build/verify/
          if-no-files-found: ignore

  android:
    name: Android build, launch and on-device test
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Authenticate pub for the private shared packages
        env:
          TOKEN: ${{ secrets.AGL_PACKAGES_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::AGL_PACKAGES_TOKEN is not set. Add it (read access to AmericanGroupLLC-Backend) as a repository or organization secret."
            exit 1
          fi
          git config --global url."https://x-access-token:$TOKEN@github.com/".insteadOf "https://github.com/"
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: tools/verify.sh pub android-build
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: tools/verify.sh android-launch android-drive
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-${{ github.job }}
          path: build/verify/
          if-no-files-found: ignore

  ios:
    name: iOS build, launch and on-device test
    needs: test
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Authenticate pub for the private shared packages
        env:
          TOKEN: ${{ secrets.AGL_PACKAGES_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::AGL_PACKAGES_TOKEN is not set. Add it (read access to AmericanGroupLLC-Backend) as a repository or organization secret."
            exit 1
          fi
          git config --global url."https://x-access-token:$TOKEN@github.com/".insteadOf "https://github.com/"
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: tools/verify.sh pub ios
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-${{ github.job }}
          path: build/verify/
          if-no-files-found: ignore
