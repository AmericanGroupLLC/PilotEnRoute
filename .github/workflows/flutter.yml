# GitHub Actions is DISABLED for this repository.
#
# All CI and delivery for the portfolio runs in one place:
#   https://github.com/AmericanGroupLLC/agl-manifest
#
# 37 repositories each running their own pipeline meant paying the runner boot,
# the Flutter SDK download and a cold pub cache 37 times over — and the macOS
# half bills at 10x. The manifest does the same work once for the batch.
#
# This file is kept, not deleted, so the pipeline is recoverable: re-enable with
#   gh api -X PUT /repos/AmericanGroupLLC/PilotEnRoute/actions/permissions -F enabled=true
#
# To validate just this app right now, from agl-manifest:
#   bundle exec fastlane validate apps:PilotEnRoute

# Superseded by agl-manifest.
#
# This duplicated the Flutter pipeline that now runs for the whole portfolio in
# one batch — see AmericanGroupLLC-Backend/docs/DELIVERY_ARCHITECTURE.md. It was
# spending a runner (and in some cases a macOS runner, billed at 10x) on every
# push to do work the nightly batch already does.
#
# Left in place rather than deleted, and still runnable by hand, in case it
# carries a step the standard pipeline does not.

name: PilotEnRoute CI/CD

on:
  workflow_dispatch:

jobs:
  # ── Analyze & Test ──────────────────────────────────────────────────────────
  analyze:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: 'stable'
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze code
        run: flutter analyze
      - name: Run tests
        run: flutter test

  # ── Build Android APK ───────────────────────────────────────────────────────
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: analyze
    if: github.event_name == 'release' || github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: 'stable'
      - name: Install dependencies
        run: flutter pub get
      - name: Build APK
        run: flutter build apk --release
      - name: Build App Bundle
        run: flutter build appbundle --release
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab

  # ── Build iOS (macOS runner) ─────────────────────────────────────────────────
  build-ios:
    name: Build iOS
    runs-on: macos-latest
    needs: analyze
    if: github.event_name == 'release'
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: 'stable'
      - name: Install dependencies
        run: flutter pub get
      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign
      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-release
          path: build/ios/iphoneos/Runner.app
