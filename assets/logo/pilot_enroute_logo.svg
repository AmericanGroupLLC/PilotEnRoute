<svg width="1120" height="320" viewBox="0 0 1120 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>PilotEnRoute logo</title>
  <defs>
    <linearGradient id="bgL" x1="0" y1="0" x2="288" y2="288" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#123A57"/>
      <stop offset="0.55" stop-color="#0D2137"/>
      <stop offset="1" stop-color="#0A1628"/>
    </linearGradient>
    <linearGradient id="planeL" x1="90" y1="198" x2="214" y2="81" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00BCD4"/>
      <stop offset="1" stop-color="#67E8F9"/>
    </linearGradient>
    <linearGradient id="trailL" x1="81" y1="207" x2="158" y2="144" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFB300" stop-opacity="0"/>
      <stop offset="1" stop-color="#FFB300"/>
    </linearGradient>
  </defs>

  <!-- ── Icon mark (rounded square) ── -->
  <g>
    <rect x="16" y="16" width="288" height="288" rx="64" fill="url(#bgL)"/>
    <circle cx="160" cy="160" r="101" stroke="#1E4A6B" stroke-width="6" fill="none"/>
    <circle cx="160" cy="160" r="101" stroke="#00BCD4" stroke-width="6" fill="none"
            stroke-dasharray="17 11" stroke-linecap="round" opacity="0.55"/>
    <path d="M85 203 L157 131" stroke="url(#trailL)" stroke-width="9" stroke-linecap="round"/>
    <path d="M214 74 L157 197 L141 156 L101 141 Z" fill="url(#planeL)"/>
    <path d="M214 74 L148 165 L141 156 Z" fill="#0A1628" opacity="0.28"/>
  </g>

  <!-- ── Wordmark ── -->
  <g font-family="'Orbitron','Arial',sans-serif">
    <text x="352" y="150" font-size="76" font-weight="700" letter-spacing="2" fill="#FFFFFF">Pilot<tspan fill="#00BCD4">EnRoute</tspan></text>
    <text x="356" y="212" font-size="27" font-weight="500" letter-spacing="6" fill="#FFB300">TRAIN · FLY · GO FURTHER</text>
  </g>
</svg>
