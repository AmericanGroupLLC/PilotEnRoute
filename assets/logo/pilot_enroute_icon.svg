<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>PilotEnRoute app icon</title>
  <defs>
    <!-- Opaque brand gradient background (aviation night sky) -->
    <linearGradient id="bg" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#123A57"/>
      <stop offset="0.55" stop-color="#0D2137"/>
      <stop offset="1" stop-color="#0A1628"/>
    </linearGradient>
    <linearGradient id="plane" x1="320" y1="704" x2="760" y2="288" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00BCD4"/>
      <stop offset="1" stop-color="#67E8F9"/>
    </linearGradient>
    <linearGradient id="trail" x1="288" y1="736" x2="560" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFB300" stop-opacity="0"/>
      <stop offset="1" stop-color="#FFB300"/>
    </linearGradient>
  </defs>

  <!-- Fully opaque background fills the whole square -->
  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- Compass ring -->
  <circle cx="512" cy="512" r="360" stroke="#1E4A6B" stroke-width="18" fill="none"/>
  <circle cx="512" cy="512" r="360" stroke="#00BCD4" stroke-width="18" fill="none"
          stroke-dasharray="60 40" stroke-linecap="round" opacity="0.55"/>
  <!-- Cardinal ticks -->
  <g stroke="#3B6E93" stroke-width="14" stroke-linecap="round">
    <line x1="512" y1="128" x2="512" y2="176"/>
    <line x1="512" y1="848" x2="512" y2="896"/>
    <line x1="128" y1="512" x2="176" y2="512"/>
    <line x1="848" y1="512" x2="896" y2="512"/>
  </g>

  <!-- Amber climb trail -->
  <path d="M300 724 L556 468" stroke="url(#trail)" stroke-width="30" stroke-linecap="round"/>

  <!-- Ascending jet / paper-plane glyph -->
  <g>
    <path d="M760 264
             L556 700
             L500 556
             L356 500
             Z"
          fill="url(#plane)"/>
    <!-- Center crease highlight -->
    <path d="M760 264 L525 588 L500 556 Z" fill="#0A1628" opacity="0.28"/>
    <!-- Wing accent -->
    <path d="M760 264 L500 556 L356 500 Z" fill="#FFFFFF" opacity="0.12"/>
  </g>
</svg>
