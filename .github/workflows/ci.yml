name: CI — PilotEnRoute

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.44.2'

jobs:
  analyze-and-test:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      # agl_i18n, agl_observability and agl_ads are git dependencies on the
      # private AmericanGroupLLC-Backend repository. A runner's built-in token
      # only reaches its own repo, so without this `flutter pub get` fails with
      # "could not read Username for 'https://github.com'".
      - name: Authenticate pub for the private shared packages
        env:
          TOKEN: ${{ secrets.AGL_PACKAGES_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::AGL_PACKAGES_TOKEN is not set. Add it as an \
          organization secret with read access to AmericanGroupLLC-Backend — \
          pub cannot fetch the shared packages without it."
            exit 1
          fi
          git config --global \
            url."https://x-access-token:$TOKEN@github.com/".insteadOf \
            "https://github.com/"

      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # Always before analyze: without it a healthy app emits bogus
      # "Method not found" errors from a stale package_config.json.
      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --reporter expanded

  build-android:
    name: Build Android release bundle
    runs-on: ubuntu-latest
    needs: analyze-and-test
    steps:
      # agl_i18n, agl_observability and agl_ads are git dependencies on the
      # private AmericanGroupLLC-Backend repository. A runner's built-in token
      # only reaches its own repo, so without this `flutter pub get` fails with
      # "could not read Username for 'https://github.com'".
      - name: Authenticate pub for the private shared packages
        env:
          TOKEN: ${{ secrets.AGL_PACKAGES_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::AGL_PACKAGES_TOKEN is not set. Add it as an \
          organization secret with read access to AmericanGroupLLC-Backend — \
          pub cannot fetch the shared packages without it."
            exit 1
          fi
          git config --global \
            url."https://x-access-token:$TOKEN@github.com/".insteadOf \
            "https://github.com/"

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # Unsigned unless key.properties is present, which it is not in CI. The
      # bundle proves the release build compiles and that R8 does not strip
      # something it needs; it is not uploadable.
      - name: Build appbundle
        run: flutter build appbundle --release

      - uses: actions/upload-artifact@v4
        with:
          name: pilotenroute-appbundle
          path: build/app/outputs/bundle/release/*.aab
          retention-days: 14
          if-no-files-found: error

  build-ios:
    name: Build iOS (no codesign)
    runs-on: macos-latest
    needs: analyze-and-test
    steps:
      # agl_i18n, agl_observability and agl_ads are git dependencies on the
      # private AmericanGroupLLC-Backend repository. A runner's built-in token
      # only reaches its own repo, so without this `flutter pub get` fails with
      # "could not read Username for 'https://github.com'".
      - name: Authenticate pub for the private shared packages
        env:
          TOKEN: ${{ secrets.AGL_PACKAGES_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::AGL_PACKAGES_TOKEN is not set. Add it as an \
          organization secret with read access to AmericanGroupLLC-Backend — \
          pub cannot fetch the shared packages without it."
            exit 1
          fi
          git config --global \
            url."https://x-access-token:$TOKEN@github.com/".insteadOf \
            "https://github.com/"

      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # --no-codesign: signing needs the Apple certificates, which CI does not
      # hold. This still catches a broken Xcode project or Info.plist.
      - name: Build iOS
        run: flutter build ios --release --no-codesign
