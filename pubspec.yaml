name: pilot_enroute
description: "PilotEnRoute — Complete Aviation Training Platform: FAA Education, AI Flight Simulation, Drone Training, Logbook, Flight Planner, Live Weather & Notifications"
publish_to: 'none'
version: 1.0.0+5
environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  # The portfolio's twelve languages, the locale controller, the picker and
  # the vocabulary every AGL app shares.
  agl_i18n:
    git:
      url: https://github.com/AmericanGroupLLC/agl-manifest.git
      path: packages/agl_i18n
      ref: master
  flutter_localizations:
    sdk: flutter
  agl_ads:
    git:
      url: https://github.com/AmericanGroupLLC/agl-manifest.git
      path: packages/agl_ads
      ref: master
  flutter:
    sdk: flutter
  agl_observability:
    git:
      url: https://github.com/AmericanGroupLLC/agl-manifest.git
      path: packages/agl_observability
      ref: master

  # ── Core UI ──────────────────────────────────────────────────────────────────
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  lottie: ^3.1.2
  animations: ^2.0.11
  flutter_staggered_animations: ^1.1.1
  percent_indicator: ^4.2.3
  confetti: ^0.7.0
  fl_chart: ^0.68.0
  flutter_svg: ^2.0.10+1

  # ── State Management ─────────────────────────────────────────────────────────
  provider: ^6.1.2

  # ── Navigation ───────────────────────────────────────────────────────────────
  go_router: ^13.2.0

  # ── Networking ───────────────────────────────────────────────────────────────
  http: ^1.2.1
  xml: ^6.5.0
  dio: ^5.4.3+1

  # ── Local Storage ────────────────────────────────────────────────────────────
  shared_preferences: ^2.2.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  sqflite: ^2.3.3+1
  path_provider: ^2.1.3
  path: ^1.9.0

  # ── Maps ─────────────────────────────────────────────────────────────────────
  flutter_map: ^6.2.1
  latlong2: ^0.9.1

  # ── Notifications ────────────────────────────────────────────────────────────
  flutter_local_notifications: ^17.2.1+2
  timezone: ^0.9.4

  # ── Utilities ────────────────────────────────────────────────────────────────
  url_launcher: ^6.3.0
  permission_handler: ^11.3.1
  connectivity_plus: ^6.0.3
  device_info_plus: ^10.1.2
  package_info_plus: ^8.0.2
  intl: any  # pinned by flutter_localizations; see docs/I18N.md
  image_picker: ^1.1.2
  qr_flutter: ^4.1.0

  # ── Documents & PDF ──────────────────────────────────────────────────────────
  pdf: ^3.11.1
  printing: ^5.13.1

  # ── Game Engine ──────────────────────────────────────────────────────────────
  flame: ^1.18.0

  # ── Markdown ─────────────────────────────────────────────────────────────────
  flutter_markdown: ^0.7.3+1

  # ── Audio ────────────────────────────────────────────────────────────────────
  audioplayers: ^6.1.0

  # ── Monetization (AdMob + IAP) ───────────────────────────────────────────────
  google_mobile_ads: ^5.1.0
  in_app_purchase: ^3.3.1

  # ── Affiliate Store ──────────────────────────────────────────────────────────
  webview_flutter: ^4.8.0
  flutter_rating_bar: ^4.0.1
  supabase_flutter: ^2.16.0

  # ── Native OAuth (Supabase-native ID-token sign-in) ──────────────────────────
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.0
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.9

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/data/
    - assets/lottie/
    - assets/logo/
