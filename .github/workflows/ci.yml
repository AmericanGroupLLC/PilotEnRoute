# GitHub Actions is DISABLED for this repository.
#
# All CI and delivery for the portfolio runs in one place:
#   https://github.com/AmericanGroupLLC/agl-manifest
#
# 37 repositories each running their own pipeline meant paying the runner boot,
# the Flutter SDK download and a cold pub cache 37 times over — and the macOS
# half bills at 10x. The manifest does the same work once for the batch.
#
# This file is kept, not deleted, so the pipeline is recoverable: re-enable with
#   gh api -X PUT /repos/AmericanGroupLLC/PilotEnRoute/actions/permissions -F enabled=true
#
# To validate just this app right now, from agl-manifest:
#   bundle exec fastlane validate apps:PilotEnRoute

name: Sanity — PilotEnRoute

# The fast gate. Analyze, plus the release-configuration checks that catch the
# failures a widget test cannot: a missing AdMob id, a debug-signed release, a
# version with no build number.
#
# The full test suite and the Android and iOS builds are NOT here. They run in
# agl-manifest, batched across the whole portfolio, so the runner boot, the
# Flutter SDK download and the pub cache are paid once instead of 37 times —
# and the macOS half, which bills at 10x, is paid once instead of 37 times.
#
# There is deliberately no `push` trigger. Pushing to the default branch is
# covered by the nightly batch; paying for a full pipeline on every push to
# every one of 37 repositories is what this replaces.

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: sanity-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.2'

jobs:
  sanity:
    name: Analyze and sanity-check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # agl_i18n, agl_observability and agl_ads are git dependencies on the
      # private AmericanGroupLLC-Backend repository. A runner's built-in token
      # only reaches its own repo, so without this `flutter pub get` fails with
      # "could not read Username for 'https://github.com'". First step on
      # purpose: a missing secret should cost seconds, not a toolchain setup.
      - name: Authenticate pub for the private shared packages
        env:
          TOKEN: ${{ secrets.AGL_PACKAGES_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::AGL_PACKAGES_TOKEN is not set. Add it as an organization secret with read access to AmericanGroupLLC-Backend."
            exit 1
          fi
          git config --global \
            url."https://x-access-token:$TOKEN@github.com/".insteadOf \
            "https://github.com/"

      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      # Infos are not fatal. The portfolio carries about a thousand of them,
      # nearly all `withOpacity` deprecations; they are tracked in the
      # readiness audit rather than used to block a release. Warnings and
      # errors still fail the job.
      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Release sanity checks
        run: flutter test --tags sanity
