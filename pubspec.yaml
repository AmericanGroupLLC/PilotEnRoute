name: pilot_enroute
description: "PilotEnRoute — a pilot logbook that works out 14 CFR 61 currency and checks live METAR/TAF against your own personal minimums."
publish_to: 'none'
version: 1.0.0+5
environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  # The portfolio's twelve languages, the locale controller, the picker and
  # the vocabulary every AGL app shares.
  agl_i18n:
    git:
      url: https://github.com/AmericanGroupLLC/agl-manifest.git
      path: packages/agl_i18n
      ref: master
  flutter_localizations:
    sdk: flutter
  agl_ads:
    git:
      url: https://github.com/AmericanGroupLLC/agl-manifest.git
      path: packages/agl_ads
      ref: master
  flutter:
    sdk: flutter
  agl_observability:
    git:
      url: https://github.com/AmericanGroupLLC/agl-manifest.git
      path: packages/agl_observability
      ref: master

  # ── Core UI ──────────────────────────────────────────────────────────────────
  cupertino_icons: ^1.0.8

  # ── State Management ─────────────────────────────────────────────────────────
  provider: ^6.1.2

  # ── Networking (aviationweather.gov, keyless) ────────────────────────────────
  http: ^1.2.1

  # ── Local Storage (logbook, Go history, profile, minimums) ───────────────────
  shared_preferences: ^2.2.3
  sqflite: ^2.3.3+1
  path_provider: ^2.1.3
  path: ^1.9.0

  # ── Lapse reminders ──────────────────────────────────────────────────────────
  flutter_local_notifications: ^17.2.1+2
  timezone: ^0.9.4

  # ── Utilities ────────────────────────────────────────────────────────────────
  url_launcher: ^6.3.0
  intl: any  # pinned by flutter_localizations; see docs/I18N.md
  image_picker: ^1.1.2

  # ── Documents & PDF ──────────────────────────────────────────────────────────
  pdf: ^3.11.1
  printing: ^5.13.1

  # ── Monetization (AdMob) ─────────────────────────────────────────────────────
  google_mobile_ads: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # Real SQLite on the host, so the v1 -> v2 logbook migration is tested
  # against an actual database file rather than a mock.
  sqflite_common_ffi: ^2.3.3

flutter:
  uses-material-design: true

  assets:
    - assets/logo/

  # Bundled, never fetched at runtime. All three are SIL Open Font License 1.1;
  # the licence texts are in assets/fonts/.
  fonts:
    - family: SofiaSansCondensed
      fonts:
        - asset: assets/fonts/SofiaSansCondensed-Regular.ttf
        - asset: assets/fonts/SofiaSansCondensed-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/SofiaSansCondensed-Bold.ttf
          weight: 700
    - family: SofiaSans
      fonts:
        - asset: assets/fonts/SofiaSans-Regular.ttf
        - asset: assets/fonts/SofiaSans-Italic.ttf
          style: italic
        - asset: assets/fonts/SofiaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/SofiaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/SofiaSans-Bold.ttf
          weight: 700
    - family: FiraMono
      fonts:
        - asset: assets/fonts/FiraMono-Regular.ttf
        - asset: assets/fonts/FiraMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/FiraMono-Bold.ttf
          weight: 700
